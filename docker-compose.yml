version: '3.8'
services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///insurance.db
      - SECRET_KEY=dev-secret
      - JWT_SECRET_KEY=dev-jwt-secret
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/instance:/app/instance

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
